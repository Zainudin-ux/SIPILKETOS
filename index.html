<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting OSIS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between font-sans" x-data="votingApp()">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-lg font-bold">Sistem Pemilihan Ketua OSIS 2026</h1>
        <p class="text-xs text-indigo-200">Pilih Pemimpin Masa Depan Sekolahmu</p>
    </header>

    <!-- Main Container (Mobile First max-w-md) -->
    <main class="w-full max-w-md mx-auto p-4 flex-grow flex flex-col justify-center">

        <!-- KONDISI 1: VOTING DITUTUP -->
        <template x-if="votingStatus === false">
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center space-y-4">
                <div class="text-4xl">⏳</div>
                <h2 class="text-xl font-bold text-slate-700">Sesi Belum Dibuka</h2>
                <p class="text-sm text-slate-500">Pemilihan OSIS belum dimulai atau sudah ditutup oleh panitia. Mohon tunggu instruksi selanjutnya.</p>
            </div>
        </template>

        <!-- KONDISI 2: HALAMAN LOGIN NIS -->
        <template x-if="votingStatus === true && step === 'login'">
            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <h2 class="text-lg font-bold text-slate-700 text-center">Silakan Masukkan NIS</h2>
                <p class="text-xs text-slate-500 text-center">Masukkan Nomor Induk Siswa (NIS) terdaftar untuk mulai memilih.</p>
                
                <form @submit.prevent="loginStudent" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nomor Induk Siswa (NIS)</label>
                        <input type="text" x-model="nisInput" placeholder="Contoh: 12345" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg tracking-widest font-mono">
                    </div>

                    <!-- Pesan Error -->
                    <template x-if="errorMessage">
                        <div class="p-3 bg-red-50 text-red-600 text-xs rounded-lg text-center font-medium" x-text="errorMessage"></div>
                    </template>

                    <button type="submit" :disabled="loading"
                        class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow hover:bg-indigo-700 transition disabled:opacity-50">
                        <span x-show="!loading">Masuk Bilik Suara</span>
                        <span x-show="loading">Memeriksa...</span>
                    </button>
                </form>
            </div>
        </template>

        <!-- KONDISI 3: BILIK SUARA (PILIH KANDIDAT) -->
        <template x-if="votingStatus === true && step === 'voting'">
            <div class="space-y-4">
                <div class="bg-indigo-50 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="text-slate-500">Pemilih:</span>
                        <span class="font-bold text-indigo-900" x-text="student.name"></span>
                    </div>
                    <span class="bg-indigo-200 text-indigo-800 px-2 py-1 rounded-md font-semibold" x-text="student.class_name"></span>
                </div>

                <h2 class="text-md font-bold text-slate-700 text-center">Daftar Kandidat Paslon</h2>

                <!-- List Kandidat -->
                <div class="space-y-4">
                    <template x-for="c in candidates" :key="c.id">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                            <img :src="c.photo_url || 'https://via.placeholder.com/400x250?text=Foto+Paslon'" alt="Paslon" class="w-full h-48 object-cover bg-slate-200">
                            <div class="p-4 flex flex-col flex-grow justify-between space-y-3">
                                <div>
                                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">Paslon No. <span x-text="c.candidate_number"></span></span>
                                    <h3 class="text-base font-bold text-slate-800 mt-2" x-text="c.name"></h3>
                                    <p class="text-xs text-slate-500 mt-1 line-clamp-3"><strong class="text-slate-700">Visi:</strong> <span x-text="c.vision"></span></p>
                                    <p class="text-xs text-slate-500 mt-1"><strong class="text-slate-700">Misi:</strong> <span x-text="c.mission"></span></p>
                                </div>
                                <button @click="confirmVote(c)" 
                                    class="w-full bg-emerald-600 text-white text-sm font-semibold py-2.5 rounded-xl shadow hover:bg-emerald-700 transition">
                                    Pilih Kandidat Ini
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- KONDISI 4: TERIMA KASIH (SUKSES MEMILIH) -->
        <template x-if="step === 'success'">
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center space-y-4">
                <div class="text-5xl">🎉</div>
                <h2 class="text-xl font-bold text-slate-800">Suara Berhasil Direkam!</h2>
                <p class="text-xs text-slate-500">Terima kasih telah menggunakan hak pilihmu dengan bijak. Suaramu menentukan masa depan sekolah.</p>
                <button @click="resetSession" class="text-xs text-indigo-600 font-semibold underline hover:text-indigo-800">Kembali ke Beranda</button>
            </div>
        </template>

    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-slate-400">
        &copy; 2026 E-Voting OSIS • Dibuat Oleh Zainudin Ahmad Ramdani
    </footer>

    <!-- LOGIKA SUPABASE & ALPINE -->
    <script>
        // INISIALISASI SUPABASE (Ganti dengan punyamu)
        const SUPABASE_URL = 'https://bsmaxoqmmibuunhhoxsd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzbWF4b3FtbWlidXVuaGhveHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDk4ODYsImV4cCI6MjEwNzQyNTg4Nn0.1v5yIaMLCeLJZfe_1FY28j9eJ8oJMeRov2a1obZS2Sg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function votingApp() {
            return {
                votingStatus: false,
                step: 'login', // 'login', 'voting', 'success'
                nisInput: '',
                student: null,
                candidates: [],
                errorMessage: '',
                loading: false,

                async init() {
                    await this.checkVotingStatus();
                    await this.fetchCandidates();
                },

                // 1. Cek apakah voting sedang dibuka oleh Admin
                async checkVotingStatus() {
                    const { data, error } = await _supabase
                        .from('settings')
                        .select('value')
                        .eq('key', 'is_voting_open')
                        .single();
                    
                    if (data) {
                        this.votingStatus = data.value;
                    }
                },

                // 2. Ambil daftar kandidat dari database
                async fetchCandidates() {
                    const { data, error } = await _supabase
                        .from('candidates')
                        .select('*')
                        .order('candidate_number', { ascending: true });
                    
                    if (data) {
                        this.candidates = data;
                    }
                },

                // 3. Proses Login NIS
                async loginStudent() {
                    this.loading = true;
                    this.errorMessage = '';

                    const { data, error } = await _supabase
                        .from('students')
                        .select('*')
                        .eq('nis', this.nisInput.trim())
                        .single();

                    this.loading = false;

                    if (error || !data) {
                        this.errorMessage = 'NIS tidak ditemukan! Periksa kembali NIS kamu.';
                        return;
                    }

                    if (data.has_voted) {
                        this.errorMessage = 'Gagal! NIS ini sudah pernah digunakan untuk memilih.';
                        return;
                    }

                    // Jika valid, simpan data siswa dan pindah ke bilik suara
                    this.student = data;
                    this.step = 'voting';
                },

                // 4. Konfirmasi dan Kirim Suara (Single Source of Truth)
                async confirmVote(candidate) {
                    if (!confirm(`Apakah kamu yakin memilih Paslon No. ${candidate.candidate_number} (${candidate.name})? Pilihan tidak dapat diubah!`)) {
                        return;
                    }

                    // A. Update status siswa: has_voted jadi true DAN catat ID kandidat di vote_number
                    const { error: errStudent } = await _supabase
                        .from('students')
                        .update({ 
                            has_voted: true, 
                            vote_number: candidate.id 
                        })
                        .eq('id', this.student.id);

                    if (errStudent) {
                        alert('Terjadi kesalahan koneksi. Silakan coba lagi.');
                        return;
                    }

                    // C. Langsung pindah ke halaman sukses (TIDAK PERLU update tabel kandidat lagi)
                    this.step = 'success';
                },
                
                resetSession() {
                    this.nisInput = '';
                    this.student = null;
                    this.errorMessage = '';
                    this.step = 'login';
                    this.checkVotingStatus();
                }
            }
        }
    </script>
</body>
</html>
